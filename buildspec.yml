version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 14
    commands:
      - echo Installing dependencies…
      # Install frontend deps
      - cd frontend
      - npm install
      - cd ..
      # Install backend deps (if needed)
      - cd backend
      - npm install
      - cd ..

  build:
    commands:
      - echo Building frontend…
      - cd frontend
      - npm run build
      - cd ..
      # Ensure the target directory exists in backend
      - echo Copying frontend build into backend…
      - mkdir -p backend/public/frontend
      - cp -r frontend/build/* backend/public/frontend/

  post_build:
    commands:
      - echo Copying startup script…
      # Assuming app_start.sh lives at the root of your repo
      - cp app_start.sh backend/
      - echo Build complete.

artifacts:
  files:
    # Include everything under backend (which now contains both backend code + frontend build + startup script)
    - backend/**/*

cache:
  paths:
    - frontend/node_modules/**/*
    - backend/node_modules/**/*
