version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 14
    commands:
      - echo "Installing frontend dependencies…"
      - cd frontend
      - npm install
      - cd ../backend
      - echo "Installing backend dependencies…"
      - npm install
      - cd ..
  build:
    commands:
      - echo "Building frontend…"
      - cd frontend
      - npm run build
      - cd ..
      - echo "Creating target folder and copying build output…"
      - mkdir -p backend/public/frontend
      - cp -r frontend/build/* backend/public/frontend/
  post_build:
    commands:
      - echo "Copying startup script…"
      # If your startup script is at the repo root, this will succeed
      - cp app_start.sh backend/
      - echo "Build complete."

artifacts:
  files:
    - backend/**/*
